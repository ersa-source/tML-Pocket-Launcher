name: Experimental Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    name: Build Android arm64 debug APK
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - name: Checkout with pinned submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.101'
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ui/launcher/package-lock.json
      - name: Install Android SDK and NDK dependencies
        shell: pwsh
        run: |
          $sdk = if ($env:ANDROID_HOME) { $env:ANDROID_HOME } else { $env:ANDROID_SDK_ROOT }
          if (-not $sdk -or -not (Test-Path $sdk)) { throw "Windows runner has no Android SDK directory" }
          $manager = Join-Path $sdk 'cmdline-tools/latest/bin/sdkmanager.bat'
          if (-not (Test-Path $manager)) {
            $manager = Get-ChildItem (Join-Path $sdk 'cmdline-tools') -Filter sdkmanager.bat -Recurse -File |
              Select-Object -First 1 -ExpandProperty FullName
          }
          if (-not $manager) { throw "sdkmanager.bat not found in $sdk" }
          Write-Host "Using sdkmanager: $manager"
          & $manager --sdk_root=$sdk --channel=3 --list
          if ($LASTEXITCODE -ne 0) { throw "Unable to list SDK packages" }
          & $manager --sdk_root=$sdk --channel=3 --install "platforms;android-37" "build-tools;37.0.0" "cmake;3.22.1" "ndk;30.0.14904198 rc1"
          if ($LASTEXITCODE -ne 0) { throw "Android SDK/NDK installation failed. See available packages above." }
      - name: Verify native sources
        shell: pwsh
        run: ./scripts/checks/check-native-sources.ps1
      - name: Build debug APK
        shell: pwsh
        working-directory: android
        run: |
          ./gradlew.bat :app:assembleDebug --stacktrace --console=plain
          if ($LASTEXITCODE -ne 0) { throw "Android APK build failed" }
      - name: List build outputs
        if: always()
        shell: pwsh
        run: |
          if (Test-Path android/app/build/outputs/apk) {
            Get-ChildItem android/app/build/outputs/apk -Recurse -File | Select-Object FullName,Length
          }
      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: tml-pocket-experimental-arm64-debug
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
