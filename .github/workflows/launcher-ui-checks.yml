name: Launcher UI checks

on:
  push:
    branches:
      - main
      - experimental/terraria-1.4.5
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ui:
    name: TypeScript, UI build and tests
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: ui/launcher
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ui/launcher/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: TypeScript validation
        run: npm run check
      - name: Build launcher UI
        run: npm run build
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Run UI tests
        env:
          PLAYWRIGHT_CHANNEL: chromium
        run: npm test
